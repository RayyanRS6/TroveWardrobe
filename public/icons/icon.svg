<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Trove</title>
  <!-- Source of every Trove icon (npm run icons renders the PNGs from it) and
       the SVG favicon. A lime clothes hanger and a coral dot on an ink tile,
       echoing the "trove." wordmark. Paths only, no fonts. The maskable and
       Apple icons reuse <g id="mark"> (keep it last and centred on 256,256). -->
  <rect id="tile" width="512" height="512" rx="116" fill="#171714"/>
  <g id="mark" fill="none" stroke="#c8ff62" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 193.3 202.7 A 34 34 0 1 1 261 198 C 261 217 227 222 227 241 L 227 256"/>
    <path d="M 94 348 L 227 256 L 360 348 Z"/>
    <circle cx="410" cy="340" r="21" fill="#ff6b4a" stroke="none"/>
  </g>
</svg>
