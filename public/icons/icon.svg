<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Trove</title>
  <!-- Source of every Trove icon (npm run icons renders the PNGs from it) and
       the SVG favicon. A blush clothes hanger and a rose dot on a plum tile,
       echoing the "trove." wordmark. The tile is the manifest's background
       colour, so on the Android splash screen it melts into the plum and only
       the hanger shows. Paths only, no fonts; the triangle starts at its
       apex (see icon-small.svg). The maskable and Apple icons reuse
       <g id="mark"> (keep it last and centred on 256,256). -->
  <rect id="tile" width="512" height="512" rx="116" fill="#1F0818"/>
  <g id="mark" fill="none" stroke="#F4B6CE" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 193.3 202.7 A 34 34 0 1 1 261 198 C 261 217 227 222 227 241 L 227 256"/>
    <path d="M 227 256 L 360 348 L 94 348 Z"/>
    <circle cx="410" cy="340" r="21" fill="#F08CAF" stroke="none"/>
  </g>
</svg>
